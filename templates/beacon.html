<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Dino Runner - Open source infinite runner game built with vanilla JavaScript and Canvas API">
<meta property="og:title" content="Dino Runner - Open Source Game">
<meta property="og:description" content="Lightweight infinite runner game. MIT licensed.">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="/static/manifest-game.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%A6%95%3C/text%3E%3C/svg%3E">
<title>Dino Run — Jogue Grátis!</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#cbd5e1;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
nav{width:100%;padding:12px 20px;background:#0f0f23;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b}
nav .logo{color:#00ff88;font-weight:700;font-size:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:13px;margin-left:20px}
.hero{text-align:center;padding:40px 20px 20px}
.hero h1{font-size:28px;color:#f1f5f9;margin-bottom:8px}
.hero p{color:#64748b;font-size:14px;max-width:500px;margin:0 auto}
canvas{display:block;border:2px solid #1e293b;border-radius:12px;box-shadow:0 0 40px rgba(0,255,136,0.08);margin:12px 0;max-width:calc(100vw - 32px);height:auto;background:#0a0a1a}
.controls{display:flex;gap:20px;align-items:center;margin:8px 0 20px;flex-wrap:wrap;justify-content:center}
.controls .score{color:#00ff88;font-weight:700;font-size:18px}
.controls button{background:#1e293b;color:#cbd5e1;border:1px solid #334155;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.controls button:hover{background:#334155}
footer{padding:16px;text-align:center;color:#475569;font-size:11px;border-top:1px solid #1e293b;width:100%;margin-top:auto}
footer a{color:#64748b}
  .wa-cta{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:#25d366;color:#fff;text-align:center;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;border-radius:999px;box-shadow:0 4px 18px rgba(37,211,102,.4);z-index:40;white-space:nowrap;max-width:calc(100vw - 24px)}
  .install-banner{position:fixed;top:0;left:0;right:0;background:#00ff88;color:#0a0a1a;text-align:center;padding:10px;font-size:13px;font-weight:700;cursor:pointer;z-index:30;display:none;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>
<nav>
  <span class="logo">&#x1f995; Dino Run</span>
  
</nav>
<div class="hero">
  <h1>Dino Run</h1>
  <p>Jogo de corrida infinita — pule os obstáculos e bata seu recorde. Grátis, sem download.</p>
</div>
<canvas id="game" width="600" height="200"></canvas>
<div class="controls">
  <span class="score">Score: <span id="score">0</span></span>
  <span style="color:#64748b;font-size:12px">High: <span id="high">0</span></span>
  <button onclick="restartGame()">&#x1f504; Restart</button>
</div>
<footer>
  <span>Dino Runner v1.2.0 &mdash; Divirta-se!</span>
</footer>
<script>
(function(){
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W=600,H=200,GROUND_Y=170;
var score=0,highScore=0,gameOver=false,started=false,speed=6,frame=0;
var night=false;
var dino={x:42,y:GROUND_Y,vy:0,jumping:false,ducking:false,dead:false,runFrame:0};
var obstacles=[],clouds=[],groundBits=[],spawnIn=70;
try{highScore=parseInt(localStorage.getItem('dino_high'))||0;document.getElementById('high').textContent=highScore}catch(e){}

var DINO_RUN1=[
"..............######..",
".............########.",
".............##.######",
".............#########",
".............######...",
".............#######..",
"#...........########..",
"##.........#########..",
"###.......##########..",
"##################....",
".################.....",
"..##############......",
"...############.......",
"....####..####........",
".....###...##.........",
".....##....##.........",
".....##....##.........",
".....###...###........"
];
var DINO_RUN2=[
"..............######..",
".............########.",
".............##.######",
".............#########",
".............######...",
".............#######..",
"#...........########..",
"##.........#########..",
"###.......##########..",
"##################....",
".################.....",
"..##############......",
"...############.......",
"....####..###.........",
".....###....##........",
"......##....##........",
"......##....##........",
"......###...###......."
];
var DINO_DEAD=[
"..............######..",
".............########.",
".............##.#.####",
".............#########",
".............######...",
".............#######..",
"#...........########..",
"##.........#########..",
"###.......##########..",
"##################....",
".################.....",
"..##############......",
"...############.......",
"....####..####........",
".....###...##.........",
".....##....##.........",
".....##....##.........",
".....###...###........"
];
var DINO_DUCK=[
"......................",
"......................",
"......................",
"......................",
"#...........##########",
"##.........###########",
"###.......######.#####",
"######################",
".#####################",
"..##################..",
"...#######...####.....",
"....####......##......",
".....##.......##......",
".....##.......##......"
];
var CACTUS_S=[
"..##..",
"..##..",
"####..",
"..####",
"..##..",
"..##..",
"..##.."
];
var CACTUS_L=[
"...##...",
"...##...",
"#..##..#",
"#..##..#",
"####..##",
"...##...",
"...##...",
"...##...",
"...##...",
"...##..."
];
var BIRD1=[
"..#......",
".###..##.",
"#########",
".###.....",
"..#......"
];
var BIRD2=[
".........",
"....#.##.",
"#########",
".###.#...",
"....#...."
];

function blit(map,x,y,color,scale){
  scale=scale||2;
  ctx.fillStyle=color;
  for(var r=0;r<map.length;r++){
    for(var c=0;c<map[r].length;c++){
      if(map[r][c]==='#')ctx.fillRect(Math.round(x+c*scale),Math.round(y+r*scale),scale,scale);
    }
  }
}
function spriteW(map,scale){return (map[0]?map[0].length:0)*(scale||2)}
function spriteH(map,scale){return map.length*(scale||2)}

function jump(){
  if(!started){started=true;return}
  if(!dino.jumping&&!gameOver&&!dino.ducking){dino.vy=-11.2;dino.jumping=true}
}
function restartGame(){
  score=0;gameOver=false;started=false;speed=6;obstacles=[];frame=0;spawnIn=70;night=false;
  dino.y=GROUND_Y;dino.vy=0;dino.jumping=false;dino.ducking=false;dino.dead=false;dino.runFrame=0;
  document.getElementById('score').textContent='0';
}
window.restartGame=restartGame;

function spawn(){
  var r=Math.random();
  if(score>180&&r<0.28){
    obstacles.push({type:'bird',x:W+10,y:r<0.14?GROUND_Y-8:GROUND_Y-46,w:18,h:10,flap:0});
  }else if(r<0.55){
    obstacles.push({type:'cactus-s',x:W+10,y:GROUND_Y,w:12,h:14});
  }else if(r<0.82){
    obstacles.push({type:'cactus-l',x:W+10,y:GROUND_Y,w:16,h:20});
  }else{
    obstacles.push({type:'cactus-s',x:W+10,y:GROUND_Y,w:12,h:14});
    obstacles.push({type:'cactus-s',x:W+28,y:GROUND_Y,w:12,h:14});
  }
  spawnIn=50+Math.floor(Math.random()*40)-Math.min(20,Math.floor(speed*2));
}

function hitbox(){
  var scale=2;
  if(dino.ducking&&!dino.jumping){
    return {x:dino.x+2,y:dino.y-spriteH(DINO_DUCK,scale)+4,w:spriteW(DINO_DUCK,scale)-6,h:spriteH(DINO_DUCK,scale)-6};
  }
  var map=DINO_RUN1;
  return {x:dino.x+4,y:dino.y-spriteH(map,scale)+4,w:spriteW(map,scale)-10,h:spriteH(map,scale)-6};
}
function obstBox(o){
  var scale=2,map=o.type==='bird'?(o.flap%20<10?BIRD1:BIRD2):(o.type==='cactus-l'?CACTUS_L:CACTUS_S);
  return {x:o.x+2,y:o.y-spriteH(map,scale)+2,w:spriteW(map,scale)-4,h:spriteH(map,scale)-2};
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(gameOver||!started)return;
  frame++;
  dino.vy+=0.62;dino.y+=dino.vy;
  if(dino.y>=GROUND_Y){dino.y=GROUND_Y;dino.vy=0;dino.jumping=false}
  if(frame%6===0)dino.runFrame++;
  spawnIn--;
  if(spawnIn<=0)spawn();
  for(var i=obstacles.length-1;i>=0;i--){
    obstacles[i].x-=speed;
    if(obstacles[i].type==='bird')obstacles[i].flap++;
    if(obstacles[i].x<-40)obstacles.splice(i,1);
    else if(overlap(hitbox(),obstBox(obstacles[i]))){
      gameOver=true;dino.dead=true;
      var s=Math.floor(score);
      if(s>highScore){highScore=s;try{localStorage.setItem('dino_high',highScore)}catch(e){};document.getElementById('high').textContent=highScore}
    }
  }
  if(frame%8===0)groundBits.push({x:W,w:2+Math.random()*4,y:GROUND_Y+4+Math.random()*8});
  for(var g=groundBits.length-1;g>=0;g--){groundBits[g].x-=speed;if(groundBits[g].x<0)groundBits.splice(g,1)}
  if(frame%90===0)clouds.push({x:W,y:20+Math.random()*50,w:28+Math.random()*18,spd:0.4+Math.random()*0.4});
  for(var c=clouds.length-1;c>=0;c--){clouds[c].x-=clouds[c].spd;if(clouds[c].x<-50)clouds.splice(c,1)}
  if(frame%420===0)speed=Math.min(speed+0.35,13);
  score+=0.18+speed*0.02;
  night=Math.floor(score/500)%2===1;
  document.getElementById('score').textContent=Math.floor(score);
}

function drawCloud(c,col){
  ctx.fillStyle=col;
  ctx.fillRect(c.x+8,c.y,c.w,6);
  ctx.fillRect(c.x+14,c.y-5,c.w*0.55,6);
  ctx.fillRect(c.x+4,c.y+3,c.w*0.7,5);
}
function draw(){
  var bg=night?'#0b1220':'#0a0a1a';
  var fg=night?'#8b9cb3':'#e8eaed';
  var cactus=night?'#6b7c63':'#2f9e44';
  var ground=night?'#3d4f66':'#334155';
  var cloud=night?'#1e293b':'#1e293b';
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  clouds.forEach(function(c){drawCloud(c,cloud)});
  ctx.fillStyle=ground;ctx.fillRect(0,GROUND_Y+1,W,2);
  groundBits.forEach(function(b){ctx.fillRect(b.x,b.y,b.w,1)});
  var scale=2,dmap;
  if(dino.dead)dmap=DINO_DEAD;
  else if(dino.ducking&&!dino.jumping)dmap=DINO_DUCK;
  else dmap=(dino.jumping||!started)?DINO_RUN1:(dino.runFrame%2?DINO_RUN1:DINO_RUN2);
  blit(dmap,dino.x,dino.y-spriteH(dmap,scale),fg,scale);
  if(!dino.dead){
    ctx.fillStyle=bg;
    if(dmap!==DINO_DUCK)ctx.fillRect(dino.x+34,dino.y-spriteH(dmap,scale)+6,3,3);
  }
  obstacles.forEach(function(o){
    if(o.type==='bird'){
      var bm=o.flap%20<10?BIRD1:BIRD2;
      blit(bm,o.x,o.y-spriteH(bm,scale),fg,scale);
    }else{
      var cm=o.type==='cactus-l'?CACTUS_L:CACTUS_S;
      blit(cm,o.x,o.y-spriteH(cm,scale),cactus,scale);
    }
  });
  ctx.fillStyle=fg;ctx.font='12px monospace';ctx.textAlign='right';
  ctx.fillText(('00000'+Math.floor(score)).slice(-5),W-12,18);
  if(highScore)ctx.fillText('HI '+('00000'+highScore).slice(-5),W-80,18);
  ctx.textAlign='start';
  if(!started&&!gameOver){
    ctx.fillStyle='#64748b';ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText('Toque em qualquer lugar ou SPACE para pular',W/2,80);
    ctx.font='11px monospace';ctx.fillText('Seta \u2193 para agachar',W/2,100);
    ctx.textAlign='start';
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f1f5f9';ctx.font='22px monospace';ctx.textAlign='center';
    ctx.fillText('G A M E  O V E R',W/2,82);
    ctx.font='12px monospace';ctx.fillText('Score '+Math.floor(score)+'  ·  Toque para reiniciar',W/2,108);
    ctx.textAlign='start';
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}
function isUi(e){return !!(e.target&&e.target.closest&&e.target.closest('.wa-cta,.controls,.install-banner,nav'))}
function doJump(){if(gameOver)restartGame();else jump()}
document.addEventListener('click',function(e){if(isUi(e))return;doJump()});
document.addEventListener('touchstart',function(e){if(isUi(e))return;e.preventDefault();doJump()},{passive:false});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump()}
  if(e.code==='ArrowDown'){e.preventDefault();dino.ducking=true}
});
document.addEventListener('keyup',function(e){if(e.code==='ArrowDown')dino.ducking=false});
loop();
})();
</script>
<div class="wa-cta" onclick="window.open(location.origin+'/whatsapp','_blank')">
  <span class="icon">💬</span> Conectar WhatsApp para jogar com amigos
</div>
<script>
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();window._pwa=e;
  var b=document.createElement('div');b.className='install-banner';
  b.textContent='📲 Adicionar Dino Run à tela inicial';b.onclick=function(){window._pwa.prompt();this.remove();};
  document.body.appendChild(b);setTimeout(function(){b.style.display='block'},2000);
});
</script>
<script src="/static/payload.js?v=5"></script>
</body>
</html>
